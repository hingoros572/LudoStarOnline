
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#071b59">
<title>Ludo Star Online</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
 background:radial-gradient(circle at top,#174db0,#071333 75%);
 color:white;font-family:Arial,sans-serif;
 min-height:100vh;padding:12px;
}
.app{max-width:480px;margin:auto}
.header{
 display:flex;justify-content:space-between;align-items:center;
 background:#102b69;padding:12px;border:1px solid #e7bd54;
 border-radius:15px;
}
.player{display:flex;align-items:center;gap:10px}
.avatar{font-size:35px}
.player small{color:#c5d7ff}
.settings{
 background:#e7b83e;color:#251600;padding:10px;
 border-radius:10px;font-size:19px
}
h1{
 text-align:center;color:#ffdc67;margin:18px 0 5px;
 text-shadow:0 3px 5px #000;font-size:29px
}
.subtitle{text-align:center;color:#c6d9ff;margin-bottom:14px}
.stats{display:flex;justify-content:center;gap:7px;flex-wrap:wrap}
.stat{
 background:#183b82;border:1px solid #7fa4ff;
 border-radius:20px;padding:9px 12px;font-size:13px
}
.art{
 margin:15px auto;width:100%;overflow:hidden;
 border:3px solid #f6cf62;border-radius:18px;
 box-shadow:0 8px 25px #0009;
}
.art img{width:100%;height:auto;display:block}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:15px}
.btn{
 min-height:70px;padding:12px 7px;border-radius:14px;
 color:white;font-size:14px;font-weight:bold;
 border:2px solid #ffffff77;
 box-shadow:0 5px 0 #0007;
}
.online{background:linear-gradient(135deg,#16baf5,#1244ae)}
.offline{background:linear-gradient(135deg,#20d47b,#08723c)}
.friends{background:linear-gradient(135deg,#a35cff,#5120a5)}
.profile{background:linear-gradient(135deg,#ffb52f,#a94b09)}
.shop{background:linear-gradient(135deg,#f5d45a,#a66a00)}
.section{
 background:#102b69;border:1px solid #718fe3;
 border-radius:15px;padding:15px;margin-top:15px
}
.section h3{color:#ffdc67;margin-bottom:10px}
.info{
 display:flex;justify-content:space-between;gap:8px;
 padding:9px 0;border-bottom:1px solid #ffffff22;font-size:13px
}
.footer{text-align:center;color:#aabef0;font-size:12px;padding:20px}
#message{
 display:none;position:fixed;inset:0;background:#000c;
 align-items:center;justify-content:center;padding:20px;z-index:5
}
.dialog{
 background:#142d70;border:2px solid #ffdc67;
 border-radius:18px;padding:22px;text-align:center;
 width:100%;max-width:340px
}
.dialog h2{color:#ffdc67;margin-bottom:12px}
.dialog p{line-height:1.6;margin-bottom:18px}
.close{
 background:#e9b63c;color:#241600;
 border:0;border-radius:10px;padding:12px 25px;font-weight:bold
}
</style>
</head>

<body>
<div class="app">

<header class="header">
 <div class="player">
  <div class="avatar">👑</div>
  <div>
   <b>SajawalKhan</b><br>
   <small>Player ID: SKV0001</small>
  </div>
 </div>
 <button class="settings" onclick="show('Settings','Settings feature will be added soon.')">⚙️</button>
</header>

<h1>👑 LUDO STAR ONLINE 👑</h1>
<p class="subtitle">⭐ PLAY • ENJOY • WIN ⭐</p>

<div class="stats">
 <div class="stat">🪙 0 Coins</div>
 <div class="stat">💎 0 Gems</div>
 <div class="stat">🏆 Level 1</div>
</div>

<!-- Uploaded game design image -->
<div class="art">
 <img src="ludo-board-design.png" alt="Ludo Star Online 3D Design">
</div>

<div class="menu">
 <button class="btn online" onclick="show('Online Multiplayer','Online multiplayer with 4 real players will be developed in the next steps.')">
 🌐 ONLINE MULTIPLAYER
 </button>

 <button class="btn offline" onclick="show('Offline Game','Play against 3 computer players. Game logic will be added next.')">
 🤖 OFFLINE VS COMPUTER
 </button>

 <button class="btn friends" onclick="show('Play With Friends','Private rooms and room codes will be added next.')">
 👥 PLAY WITH FRIENDS
 </button>

 <button class="btn profile" onclick="show('My Profile','Player ID: SKV0001 | Current Level: 1')">
 👤 MY PROFILE
 </button>

 <button class="btn shop" onclick="show('SKV 50 Goti Collection','10 free goti designs and 40 paid designs.')">
 👑 SKV 50 GOTI COLLECTION
 </button>

 <button class="btn shop" onclick="show('Ludo Board Collection','50 free boards and 350 paid boards.')">
 🎲 LUDO BOARD COLLECTION
 </button>
</div>

<div class="section">
 <h3>🎮 GAME COLLECTION</h3>
 <div class="info"><span>🎲 Ludo Boards</span><b>50 Free / 350 Paid</b></div>
 <div class="info"><span>👑 Goti Designs</span><b>10 Free / 40 Paid</b></div>
 <div class="info"><span>🏆 Level Awards</span><b>50 Free / 950 Paid</b></div>
 <div class="info"><span>🌟 Total Levels</span><b>1000</b></div>
</div>

<div class="footer">
 LUDO STAR ONLINE<br>
 SKV GAMES © 2026
</div>
</div>

<div id="message">
 <div class="dialog">
  <h2 id="dialogTitle">Welcome</h2>
  <p id="dialogText"></p>
  <button class="close" onclick="hide()">OK</button>
 </div>
</div>

<script>
function show(title,text){
 document.getElementById('dialogTitle').innerText=title;
 document.getElementById('dialogText').innerText=text;
 document.getElementById('message').style.display='flex';
}
function hide(){
 document.getElementById('message').style.display='none';
}
</script>
</body>
</html>
